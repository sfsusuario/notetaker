[package]
name = "notetaker"
version = "0.1.0"
description = "Transcripción de reuniones en vivo o desde grabaciones, historial y chat con IA"
authors = ["efsteps"]
edition = "2021"

[lib]
name = "notetaker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "process", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
cpal = "0.15"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "stream", "rustls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
hound = "3.5"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "ogg", "vorbis", "flac", "wav", "pcm"] }
sysinfo = "0.35"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
url = "2"
thiserror = "2"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_Security",
] }
winreg = "0.55"
